<!DOCTYPE html>
<html>
    <head>
        <title>NoM: Upload Data</title>
        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    </head>

    <body>
        {% include "header.html" %}

        <main>
            <form>
                <p>
                    <label for="file">Загрузить данные <br>(формат .csv)<br></label>
                    <input type="file" name="file" id="file" required hx-post="/upload" hx-trigger="change" hx-encoding="multipart/form-data" hx-swap="" hx-target="#error-message">
                </p>
                <p id="error-message"> {{ df_html | safe}} </p>
            </form>
        </main>
    </body>
</html>
