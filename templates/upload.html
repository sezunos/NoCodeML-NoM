<!DOCTYPE html>
<html>
    <head>
        <title>NoM: Загрузить Датасет</title>
        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        {% include "header.html" %}

        <main>
            <form>
                <p>
                    <label for="file">Загрузить данные (формат .csv)</label>
                    <input type="file" name="file" id="file" required
                        hx-post="/upload"
                        hx-trigger="change"
                        hx-encoding="multipart/form-data"
                        hx-target="#message">
                </p>
                <p id="message">{{ df_html | safe }}</p>
            </form>
        </main>
    </body>
</html>
